name: T3 Remix desktop builds

# Unsigned T3 Remix installers for every desktop platform, plus the standalone
# `t3` server archives, kept as run artifacts. Windows cross-builds on Linux the
# way release-desktop.yml does. With a release tag, they are also attached to
# that GitHub Release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to attach the installers to, such as v0.1.6. Leave empty to only build.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: remix-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  T3CODE_DESKTOP_APP_ID: com.codingphase.t3office
  T3CODE_DESKTOP_PRODUCT_NAME: T3 Remix
  T3CODE_DESKTOP_ICON_PNG: assets/fork/t3-remix-macos-1024.png
  T3CODE_DESKTOP_ICON_ICO: assets/fork/t3-remix-windows.ico
  T3CODE_DESKTOP_HOME_DIR: .t3-remix
  T3CODE_DESKTOP_USER_DATA_DIR: t3remix

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-15
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: ubuntu-24.04
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      # actions/checkout's submodule cleanup fails on the vendored .repos gitlinks.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # Windows needs these too: the JS build compiles the Linux browser secret helper on any Linux host.
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Install cargo-xwin
        if: matrix.platform == 'win'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-xwin@0.23.1

      # The desktop build runs plain `cargo build`, which cannot link MSVC on Linux.
      - name: Build Windows resource monitor
        if: matrix.platform == 'win'
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ matrix.platform == 'win' }}
        # GITHUB_REPOSITORY would become an update feed, and unsigned Mac builds cannot install updates.
        run: |
          unset GITHUB_REPOSITORY
          vp run dist:desktop:artifact --platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --verbose

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3-remix-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
          if-no-files-found: error
          compression-level: 0

  # The standalone `t3` server that the install script, `t3 update`, and desktop SSH environments
  # download. Windows and Intel Macs have no archive, as upstream (see cliRelease.ts).
  cli:
    name: CLI ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - label: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      # A missing release tag match would publish archives that `t3 --version` contradicts.
      - name: Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./apps/server/package.json").version')"
          if [[ -n "$TAG" && "${TAG#v}" != "$version" ]]; then
            echo "Release tag $TAG does not match apps/server/package.json version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build server and web client
        run: vp run --filter t3 build

      # Matches the branding the desktop build applies to the same client.
      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$target_dir/"

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      # Without T3CODE_CLI_MAC_SIGN_IDENTITY the macOS executable is signed ad hoc.
      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --version "${{ steps.version.outputs.version }}"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ steps.version.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach to release
    needs: [build, cli]
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: t3-remix-*
          path: built
          merge-multiple: true

      # A missing file means the tag does not match the app's package version.
      - name: Name installers
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir assets
          mv "built/T3-Code-$version-arm64.dmg" "assets/T3-Remix-$version-mac-arm64.dmg"
          mv "built/T3-Code-$version-x64.dmg" "assets/T3-Remix-$version-mac-x64.dmg"
          mv "built/T3-Code-$version-x86_64.AppImage" "assets/T3-Remix-$version-linux-x86_64.AppImage"
          mv "built/T3-Code-$version-x64.exe" "assets/T3-Remix-$version-windows-x64-setup.exe"

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          path: assets
          merge-multiple: true

      # Files the release already has are kept, so a re-run never swaps a published download.
      - name: Attach installers and CLI archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            site="$(gh api "repos/$GH_REPO" --jq '.homepage // ""')"
            site="${site:-https://github.com/$GH_REPO}"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "T3 Remix ${TAG#v}" \
              --notes "What's new is in the [dev log]($site/docs/devlog/). Install steps for each platform are in the [install guide]($site/docs/install/)."
          fi
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for file in assets/*; do
            name="$(basename "$file")"
            if grep -qxF "$name" <<<"$existing"; then
              echo "Keeping the published $name."
            else
              gh release upload "$TAG" "$file"
            fi
          done

      # Installers verify archives against this file, so it hashes the published bytes, which a
      # re-run may have kept from an earlier build.
      - name: Write CLI archive checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 't3-*' --dir published
          (cd published && sha256sum t3-* > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" published/SHA256SUMS --clobber
